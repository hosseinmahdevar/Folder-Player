name: FolderPlay Flutter Multi-Platform Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. VERIFY & ANALYZE DART CODE
  # =========================================================================
  test:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze || true

  # =========================================================================
  # 2. BUILD ANDROID (APK & App Bundle AAB)
  # =========================================================================
  build-android:
    name: Build Android (APK & AAB)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android Release Bundle (AAB)
        run: flutter build appbundle --release

      - name: Archive Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folderplay-android-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  # =========================================================================
  # 3. BUILD DESKTOP LINUX
  # =========================================================================
  build-linux:
    name: Build Linux Desktop (x86_64)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Desktop App
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../folderplay-linux-x64.tar.gz .

      - name: Archive Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: folderplay-linux-x64
          path: folderplay-linux-x64.tar.gz

  # =========================================================================
  # 4. BUILD DESKTOP WINDOWS
  # =========================================================================
  build-windows:
    name: Build Windows Desktop (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath folderplay-windows-x64.zip

      - name: Archive Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: folderplay-windows-x64
          path: folderplay-windows-x64.zip

  # =========================================================================
  # 5. BUILD DESKTOP macOS
  # =========================================================================
  build-macos:
    name: Build macOS Desktop (Universal)
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS Zip
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../folderplay-macos-universal.zip FolderPlay.app

      - name: Archive macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: folderplay-macos-universal
          path: folderplay-macos-universal.zip

  # =========================================================================
  # 6. AUTOMATED GITHUB RELEASE
  # =========================================================================
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-android, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Prepare Release Directory
        run: |
          mkdir -p release-assets
          cp -r folderplay-android-builds/* release-assets/ 2>/dev/null || true
          cp -r folderplay-linux-x64/* release-assets/ 2>/dev/null || true
          cp -r folderplay-windows-x64/* release-assets/ 2>/dev/null || true
          cp -r folderplay-macos-universal/* release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Create GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          name: FolderPlay Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## FolderPlay Release ${{ github.ref_name }}
            
            Pure Flutter offline audiobook player for Android & Desktop.
            
            ### Included Binaries
            - **Android APK**: Standalone release package for phones, tablets & car head units.
            - **Android App Bundle (.aab)**: Google Play Store ready distribution package.
            - **Linux Desktop (.tar.gz)**: Native 64-bit Linux workstation binary.
            - **Windows Desktop (.zip)**: Native Windows x64 executable and runtime DLLs.
            - **macOS Desktop (.zip)**: Native Universal macOS application bundle.
