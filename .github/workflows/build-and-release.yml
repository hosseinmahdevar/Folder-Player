name: FolderPlay Flutter Multi-Platform Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. VERIFY & ANALYZE DART CODE
  # =========================================================================
  test:
    name: Flutter Lint & Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev

      - name: Enable Linux Desktop & Scaffold Runner
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --project-name folderplay .

      - name: Analyze Dart Code
        run: flutter analyze || true

      - name: Run E2E & Integration Tests (Headless Linux Display)
        run: |
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum flutter test integration_test/ -d linux

  # =========================================================================
  # 2. BUILD ANDROID (APK & App Bundle AAB)
  # =========================================================================
  build-android:
    name: Build Android (APK & AAB)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Self-healing: ensures Android platform files & gradle wrappers exist
      - name: Ensure Android platform files
        run: flutter create --platforms=android --project-name folderplay .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android Release Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Archive Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folderplay-android-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  # =========================================================================
  # 3. BUILD DESKTOP LINUX
  # =========================================================================
  build-linux:
    name: Build Linux Desktop (x86_64)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      # Self-healing: ensures Linux desktop runner & CMake files exist
      - name: Ensure Linux platform files
        run: flutter create --platforms=linux --project-name folderplay .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Desktop App
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          tar -czvf folderplay-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Archive Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: folderplay-linux-x64
          path: folderplay-linux-x64.tar.gz

  # =========================================================================
  # 4. BUILD DESKTOP WINDOWS
  # =========================================================================
  build-windows:
    name: Build Windows Desktop (x64)
    needs: test
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # Self-healing: ensures Windows desktop runner & CMake files exist
      - name: Ensure Windows platform files
        run: flutter create --platforms=windows --project-name folderplay .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath folderplay-windows-x64.zip

      - name: Archive Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: folderplay-windows-x64
          path: folderplay-windows-x64.zip

  # =========================================================================
  # 5. BUILD DESKTOP macOS
  # =========================================================================
  build-macos:
    name: Build macOS Desktop (Universal)
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      # Self-healing: ensures macOS desktop runner files exist
      - name: Ensure macOS platform files
        run: flutter create --platforms=macos --project-name folderplay .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS Tarball
        run: |
          APP_BUNDLE=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
          APP_NAME=$(basename "$APP_BUNDLE")
          tar -czvf folderplay-macos-universal.tar.gz -C build/macos/Build/Products/Release "$APP_NAME"

      - name: Archive macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: folderplay-macos-universal
          path: folderplay-macos-universal.tar.gz

  # =========================================================================
  # 6. AUTOMATED GITHUB RELEASE
  # =========================================================================
  release:
    name: Create GitHub Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-android, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Release Directory
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          name: FolderPlay Release (${{ github.ref_name }})
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## FolderPlay Release ${{ github.ref_name }}
            
            Pure Flutter offline audiobook player for Android & Desktop.
            
            ### Included Binaries
            - **Android APK**: Standalone release package for phones, tablets & car head units.
            - **Android App Bundle (.aab)**: Google Play Store ready distribution package.
            - **Linux Desktop (.tar.gz)**: Native 64-bit Linux workstation binary.
            - **Windows Desktop (.zip)**: Native Windows x64 executable and runtime DLLs.
            - **macOS Desktop (.tar.gz)**: Native Universal macOS application bundle.
